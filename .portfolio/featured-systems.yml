      from a fresh copy; filer, master, S3, and volume read 1/1 Ready across dev, int, and prod, and the
      object-arrival event is pinned to concrete fields with oldEntry null, though the evidence rests
      on readiness states rather than pass counts.
  average: 8.33
  rationale: Zero-cost local rehearsal of a federal delivery path, bounded by a map of what it cannot
    prove
  featured: true
- slug: compliance-evidence-bundle
  axis_scores:
    technical_depth: 7
    voice: 9
    validation: 8
  axis_reasoning:
    technical_depth: 'The 52-edge diagram sits fourth in the lens by density, behind the 57-edge JWCC
      map, the 55-edge CDC harness, and the 53-edge GitOps bootstrap, and it teaches rather than decorates:
      the contract committed before any artifact, the meaning of STUBBED, the predicted-outcome rule for
      each negative test, the restore-then-rerun step that separates a contract refusal from a broken
      publisher, the two SHA-256 keys in the store, and the cold read reported as compromised are all
      first-class nodes. The system itself belongs with the CDC harness and container hardening at 7 rather
      than with the peers at 8: one Windows workstation running Syft, Grype, cosign, a local SeaweedFS,
      and Python glue for schema validation, digest calculation, publication, and retrieval, a roughly
      60-minute build with no cluster, no control plane, no authorization boundary, and no control tailoring.
      Two of the six slots (hardening-check and control-map) ship STUBBED, the cosign provenance material
      is never described beyond its slot name, and no decision record carries a reversal condition the
      way DR-002 and ADR-001 do in the systems scored 8.'
    voice: 'First person carries ownership at the second highest density in the lens (26 uses of I across
      2,159 words, behind only the CDC harness) and every subsection closes on what the result did not
      prove: Git history is evidence of sequence and not proof of integrity because a repository owner
      can rewrite commits and dates, STUBBED means neither failed nor passed nor waived, retrieval proves
      nothing about replication, retention, or an administrator who can delete objects, and the acceptance
      test is reported as too close to count as independent review. Headings are specific rather than
      scaffold (Why the first bundle''s digest is the stronger claim; What three publish runs together
      prove about the contract), with none of the What this step accomplishes markers the CDC harness
      carries, and the hardest-part section names a discipline (documenting reader proximity honestly
      while keeping the proven value clear) instead of a tooling anecdote. No banned verbs and no dash-family
      characters appear in the README or the source doc. Held below 10 by the toolchain and reflections
      sections, which restate the tool inventory in curriculum cadence, and by one curriculum word choice
      (the citer) in the acceptance phase.'
    validation: 'The publish gate phase is the strongest and it is built as a predicted-then-observed
      sequence: two negative runs (a required file removed while its slot stays named in the manifest,
      then schema and digest expectations broken) each carry an outcome written before the run, the gate
      stops before upload and mints no key, and a third run after restoring the original files prints
      [PUBLISHED] with the full SHA-256 digest 0215a0fe7efdf0057c020e860d3eb4c9dcf3b20a5d1eb0bb1f1b33735059db04,
      which is the kind of concrete artifact value the CDC and container-hardening passes were held for
      lacking. The storage phase adds a second published bundle, two distinct keys in the store, and a
      retriever that fetches the older key after the workspace was overwritten, recomputes the digest,
      and matches it, with SeaweedFS health pinned to HTTP 200 on localhost:8333 after four recorded failed
      starts. The manifest reads 4 READY and 2 STUBBED with the stubs named (linux-ci-pipeline-run-001,
      control-map-population-001). Held below the 9s by the same shape of holes the prior pass named on
      the peers at 8: no evidence artifact is named by path the way docs/drift-evidence.txt and capability-map/failover-proof.md
      are, the Grype scan never reports a finding count, the Syft inventory size and the cosign provenance
      content are never stated, the second bundle''s digest is not shown, the control questions are never
      listed or counted, and the cold-read acceptance test is reported by the doc itself as compromised
      by reader proximity.'
  average: 8.0
  rationale: Contract-first evidence bundle, publish gate proven to refuse, two stubbed slots kept visible
  featured: true
- slug: cdc-consumer-correctness-harness
  axis_scores:
    technical_depth: 7
    voice: 9
    validation: 8
  axis_reasoning:
    technical_depth: 'The 55-edge diagram is the second densest in the lens after the 57-edge JWCC map
      and it teaches rather than decorates: the two wrong consumers, the two guard assertions, the replay,
      the independent DuckDB verifier, and the structural-versus-regression split are all first-class
      nodes, and the lexicographic ordering defect that makes the upsert fail is drawn as an edge. The
      system itself sits with container-hardening rather than the peers scored at 8: a single-host harness
      of one deterministic generator, three Python consumers, one PostgreSQL 18 target, and one DuckDB
      verifier, a roughly 60-minute build with no distributed components, no authorization boundary, and
      no control tailoring; the NIST SP 800-47 interconnection checklist is an annex the doc itself says
      does not prove compliance, and streaming concerns (late, repeated, out-of-order events, checkpoints)
      are named as future work.'
    voice: 'First person carries ownership at the highest density in the lens (29 uses of I across 2,262
      words) and limits are stated harder than results throughout: passing count and checksum showed the
      consumer reached the expected state for this fixture and did not establish correctness for every
      schema, order, or production feed; the real CDF check was narrow; the harness proved its declared
      cases, not every CDC architecture. The hardest-part section names the exact discipline (a claim
      about consumer logic versus a claim about one dated execution) instead of a tooling anecdote. No
      banned verbs and no dash-family characters appear in the README or the source doc. Held below 10
      by five What this step accomplishes scaffold headings, a curriculum marker no peer carries, and
      one generic paragraph in the stack phase about consistent delivery structure.'
    validation: 'The wrong-consumers phase is the strongest and it is built as a controlled comparison
      against one fixed seeded fixture: the append consumer lands 2,120 rows against an expected 80 so
      the count catches it, the upsert consumer lands exactly 80 keys so the count reports MATCH and only
      the SHA-256 checksum over canonical rows fails, and the correct consumer then passes both measurements
      and holds them after a replay of the same feed, with a ValueError guard on unknown change types
      and a removed equals expected-preimage-count guard on the filter. The release phase adds a real
      Delta-rs Change Data Feed shape check that confirms _change_type, _commit_version, _commit_timestamp
      and the underscore vocabulary while stating it proves interface shape only. The same holes the prior
      pass named on container-hardening hold it below the 9s: no evidence artifact is named by path the
      way docs/drift-evidence.txt and capability-map/failover-proof.md are in the peers, no digest value
      is shown, the number of stale values inside the upsert''s 80 keys is left at several, and the CI
      checks added at release are never named.'
  average: 8.0
  rationale: CDC harness where a matching row count hides stale values and only the SHA-256 checksum fails
  featured: false
- slug: container-hardening-pipeline
  axis_scores:
    technical_depth: 7
    voice: 9
    validation: 8
  axis_reasoning:
    technical_depth: 'The 51-edge diagram is among the five densest in the lens and it teaches rather
      than decorates: it carries the four ADRs, the ComplianceAsCode fidelity limit, the 228-less-198
      denominator arithmetic, and the handover drill that did not pass as first-class nodes. The system
      itself is narrower than the peers scored at 8: one Ubuntu 22.04 image through one GitHub Actions
      workflow with OpenSCAP, Ansible, and Trivy on WSL2, a roughly 90-minute build with no distributed
      components, no authorization boundary, and no control tailoring.'
    voice: 'States its own limits harder than its results and ships a phase that failed: ADR-001 records
      that community-maintained profiles are not an assessment of record with DISA content or the SCC
      scanner, a green run is scoped to this image passing these declared controls at this moment, and
      the handover section opens by saying no second person completed the test rather than dressing the
      gap up. First person carries ownership throughout, with only mild third-person summary cadence in
      the middle sections.'
    validation: 'The BEFORE and AFTER phase carries the most disciplined arithmetic in the lens: 228 evaluated
      less 198 not applicable fixes a 30-rule denominator, 7 failures fall to 1 and 23 passes rise to
      29, and both sides reconcile to 30 so the reduction is attributable to remediation rather than a
      changed scope. Two holes hold it below the 9s: Trivy is named as a required gate six times but no
      vulnerability finding is ever reported, and no evidence artifact is named by path the way the failover
      proof and drift evidence files are in the peer systems.'
  average: 8.0
  rationale: Container hardening where a fixed 30-rule denominator makes the 7-to-1 reduction attributable
  featured: false
- slug: governed-dora-delivery-measures
  axis_scores:
    technical_depth: 7
    voice: 8
    validation: 7
  axis_reasoning:
    technical_depth: 'The 45-edge diagram sits sixth in the lens by density, behind the 47-edge rehearsal
      rig and ahead of the 34-edge enclave, and it teaches rather than decorates: the negative control
      is drawn as its own subgraph with before, broken, and restored readings, the empty stability panels
      are drawn as a data-boundary finding that names the next required source, the unrecorded review
      and the tested ADR-003 trigger are first-class nodes, and the git-ignored 128-character ENCRYPTION_SECRET
      appears as a component. Decision-record discipline is the strongest in the lens: four ADRs each
      carry a reversal trigger and one trigger is checked against the live configuration, which is the
      reversal-condition habit the prior pass held the compliance bundle for lacking. The system itself
      belongs with the CDC harness, container hardening, and the compliance bundle at 7 rather than with
      the peers at 8: a Docker Compose stack of Apache DevLake, Grafana, and their databases on one Windows
      workstation, a local GitLab CE 19.3.1 project seeded with four production deployments, one Incoming
      Webhook, and a roughly 90-minute build with no cluster, no authorization boundary, no federal accounts,
      and no control tailoring. Rework Rate, the fifth governed measure, never appears in the build beyond
      its definition and its ADR, and the README lists the seven phases in reverse build order, so Publishing
      is named as the input anchor when it is the output.'
    voice: 'First person carries ownership at the highest count in the lens (33 uses of I across 2,387
      words, ahead of the CDC harness at 29) and every phase closes on what the result did not prove:
      the negative control is a test of measurement integrity and not of application reliability, access
      checks are readiness evidence and not proof that each source held complete data, the duplicate secret
      copy is not an enterprise secret-management design, and assignment and access do not prove a neutral
      reviewer performed the challenge. Headings are specific (Tracing how missing incidents create a
      false gain; Recognizing incomplete stability evidence), no What this step accomplishes scaffold
      appears, no banned verbs and no dash-family characters appear in the README or the source doc, and
      the hardest-part section names a discipline (coordinating the independent review without contaminating
      it). On prose alone this sits with the peers at 9. It is held to 8 by a defect no peer carries:
      three paragraphs in the source doc break off before their final word or period (stand wi, stability
      measure, condit), and the first of them is the closing sentence of the README Overview, so the first
      block every visitor reads stops before its point lands. Restoring those three sentences would return
      the prose to 9.'
    validation: 'The negative control is the strongest phase and it is built as a controlled before, broken,
      and restored sequence with one variable: the Incoming Webhook is detached while the four production
      deployments stay untouched, Collect Data is rerun, the relationship table empties and Change Failure
      Rate reads 0 percent, then the webhook is reattached and the original rate returns. Evidence artifacts
      are named by path in the way the peers at 8 were held for lacking: governance/decisions.md, governance/validation.md,
      the Evidence 1.0 GitHub release, Linear item PS-160, and secrets/devlake-encryption-secret.txt.
      The red-team phase adds a real trigger test (ADR-003 checked against the live configuration, verdict
      Accept) and reports the independent review as open rather than complete. It is held at 7, level
      with the GovRAMP lab, because the headline evidence stays unquantified in prose: the original failure
      rate, the restored rate, and the timestamps that the governance pack itself says a passing check
      requires are never stated, so the only measured value in 2,387 words is the broken-state 0 percent;
      Deployment Frequency, Change Lead Time, and Recovery Time never receive a value, Rework Rate is
      never measured, and the review phase ships with no recorded result. Each system scored 8 shows at
      least one concrete before-and-after pair or digest (7 failures to 1 on a fixed 30-rule denominator,
      2,120 rows against 80, a full SHA-256) and this one does not.'
  rationale: Governed DORA measures where a detached incident webhook fakes a 0% failure rate on purpose
  average: 7.33
  featured: false
- slug: multi-cloud-govramp-lab
  axis_scores:
    technical_depth: 8
    voice: 7
    validation: 7
  axis_reasoning:
    technical_depth: Four k3s clusters across AWS, Azure, GCP, and an on-prem hub with per-cloud OpenTofu
      modules, Argo CD App-of-Apps from the hub, a Velero cross-cluster restore, a 60-control GovRAMP
      crosswalk, and a Crossplane versus OpenTofu comparison; the system is the broadest in the lens,
      but the 19-edge diagram carries far less of it than the peers carry of theirs.
    voice: The README is specific about scope, controls, and evidence coming before workloads, but the
      source doc falls into a passive step-summary cadence (this step establishes, this confirms, this
      demonstrates) that reads as curriculum rather than build notes.
    validation: The ATO readiness phase is the strongest, with gaps routed to a remediation register and
      the system called partially rather than fully compliant, but the DR drill reports its RTO and RPO
      only as values well within thresholds, so the headline recovery evidence stays unquantified in prose.
  average: 7.33
  rationale: Four-cluster GovRAMP lab with a cross-cluster DR drill and a 60-control crosswalk
  featured: false
- slug: fedramp-landing-zone-azure
  axis_scores:
    technical_depth: 7
    voice: 7
    validation: 6
  axis_reasoning:
    technical_depth: Seven-phase Azure landing zone with a real management group hierarchy, three Azure
      Policy assignments (CM-7, SC-7, SC-28), centralized activity-log diagnostics, a Prowler CIS scan,
      and a CIS-to-NIST 800-53 crosswalk feeding an SSP; the diagram is the thinnest in the lens at 16
      edges and stops at one flow per component.
    voice: The README line that compliance is enforced through infrastructure, not documentation, is on
      brand, but the source doc runs on third-person curriculum summary lines such as Prowler evaluates
      the environment against the CIS Azure Benchmark.
    validation: 'Every phase is screenshot-anchored, including the Prowler run and the SC-28 re-scan,
      but no result is recorded numerically: coverage is described as higher after the third policy with
      no pass/fail counts or percentages in prose, the thinnest evidence set in the lens.'
  average: 6.67
  rationale: Azure landing zone where NIST 800-53 controls land as Terraform policy, not paperwork
  featured: false
