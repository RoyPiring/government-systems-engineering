- slug: jwcc-multi-cloud-authorization
  axis_scores:
    technical_depth: 10
    voice: 9
    validation: 9
  axis_reasoning:
    technical_depth: The 57-edge diagram names real CSP firewalls, Rego-to-SC control edges, the capability
      router fallback, and the failover re-inheritance loop; four providers carry one boundary, four Rego
      policies map to SC-7, SC-8, and SC-28, and the RPO and RTO targets (15 and 30 minutes) shape the
      design rather than decorate it.
    voice: Names the capability gap and the difference between an engineering failover and an authorization
      failover with no hedging, and states plainly that a provider move re-inherits 107 controls and sends
      the SSP back to the Authorizing Official.
    validation: 'The failover phase is strongest: 4 minutes 40 seconds measured from gap declaration to
      a working Azure plan against a 30-minute target, documented in capability-map/failover-proof.md,
      with the RPO honestly labeled a 15-minute design target rather than a live lag measurement.'
  average: 9.33
  rationale: Boundary-first multi-cloud authorization proving portability and a 4.67-minute failover
  featured: true
- slug: gitops-dev-zone-bootstrap
  axis_scores:
    technical_depth: 8
    voice: 9
    validation: 9
  axis_reasoning:
    technical_depth: Kind cluster plus Argo CD with a deliberate two-repository split (DR-002, carrying
      its own reversal condition), Kustomize base and per-zone overlays, an AppProject fence on both source
      and destination, and a two-speed sync policy (DR-004); the 53-edge diagram carries the bootstrap-secret
      rotation chain and the drift drill as first-class flow, though the workload is a single local nginx
      Deployment with no federal control tailoring.
    voice: 'Sharp and free of filler: detection and correction are named as separate capabilities, the
      failed initial-password read is read as proof the credential is gone rather than proof access was
      lost, and the two boundary-violation attempts are kept apart so an unreachable repository is never
      reported as a blocked one.'
    validation: 'The drift drill is the strongest phase and it is built as a controlled A/B: self-heal
      off leaves 3/3 standing 30 seconds after OutOfSync, self-heal on returns 5 replicas to 1/1 in about
      6 seconds with the result preserved in docs/drift-evidence.txt, and the AppProject phase adds a
      negative test that separates a connectivity failure from a project refusal.'
  average: 8.67
  rationale: GitOps path proving drift detection and correction are separate, 5 replicas back to 1 in
    6 seconds
  featured: true
- slug: closed-enclave-connection-authorization
  axis_scores:
    technical_depth: 9
    voice: 9
    validation: 8
  axis_reasoning:
    technical_depth: NIST SP 800-53 Rev 5 OSCAL catalog tailored through CNSSI 1253 with FIPS 140-3 pinned
      as sc-13_prm_1, three separate authorization boundaries, and a closed Terraform baseline with no
      internet gateway or NAT, Transit Gateway blackhole routes, Network Firewall inspection, KMS, and
      SPIFFE/SPIRE; the 34-edge diagram names each boundary and the path the injected route reopened.
    voice: 'Direct and on brand throughout: the connection is treated as part of the system, the allow-by-exception
      protocol set is stated plainly (TLS 1.3 on 443, gRPC/TLS on 8081), and no filler verbs appear in
      the README or the source doc.'
    validation: Strongest evidence sits in the injected-finding phase, where the cross-domain route is
      caught by the four-scanner gate, remediated with an explicit blackhole and propagation left off,
      and closed as POAM-001 at 0 open items on a clean re-scan; the proof rests on scanner counts rather
      than a live authorization decision.
  average: 8.67
  rationale: Closed SECRET enclave that proves its boundary before it connects, injected finding driven
    to zero
  featured: true
- slug: zero-cost-federal-rehearsal-rig
  axis_scores:
    technical_depth: 8
    voice: 9
    validation: 8
  axis_reasoning:
    technical_depth: Three-namespace kind cluster with Kustomize overlays per zone, SeaweedFS master,
      volume, filer, and S3 in all three, PostgreSQL 18 split into migration_user and app_user, and GitLab
      CE stages that only ran once the runner network path to the cluster API was traced; the 47-edge
      diagram is detailed, but the rig deliberately carries no federal accounts, OSCAL artifacts, or control
      tailoring.
    voice: 'States its own limits harder than its results, which is the brand itself: the rig must never
      be treated as proof of production readiness, provisioning lead time is named as an organizational
      dependency rather than a Kubernetes object, and a fast clean-clone is called out as proving local
      setup speed only.'
    validation: The release phase is strongest, replacing an estimated setup duration with a timed clean-clone
      from a fresh copy; filer, master, S3, and volume read 1/1 Ready across dev, int, and prod, and the
      object-arrival event is pinned to concrete fields with oldEntry null, though the evidence rests
      on readiness states rather than pass counts.
  average: 8.33
  rationale: Zero-cost local rehearsal of a federal delivery path, bounded by a map of what it cannot
    prove
  featured: true
- slug: container-hardening-pipeline
  axis_scores:
    technical_depth: 7
    voice: 9
    validation: 8
  axis_reasoning:
    technical_depth: 'The 51-edge diagram is the second densest in the lens and it teaches rather than
      decorates: it carries the four ADRs, the ComplianceAsCode fidelity limit, the 228-less-198 denominator
      arithmetic, and the handover drill that did not pass as first-class nodes. The system itself is
      narrower than the peers scored at 8: one Ubuntu 22.04 image through one GitHub Actions workflow
      with OpenSCAP, Ansible, and Trivy on WSL2, a roughly 90-minute build with no distributed components,
      no authorization boundary, and no control tailoring.'
    voice: 'States its own limits harder than its results and ships a phase that failed: ADR-001 records
      that community-maintained profiles are not an assessment of record with DISA content or the SCC
      scanner, a green run is scoped to this image passing these declared controls at this moment, and
      the handover section opens by saying no second person completed the test rather than dressing the
      gap up. First person carries ownership throughout, with only mild third-person summary cadence in
      the middle sections.'
    validation: 'The BEFORE and AFTER phase carries the most disciplined arithmetic in the lens: 228 evaluated
      less 198 not applicable fixes a 30-rule denominator, 7 failures fall to 1 and 23 passes rise to
      29, and both sides reconcile to 30 so the reduction is attributable to remediation rather than a
      changed scope. Two holes hold it below the 9s: Trivy is named as a required gate six times but no
      vulnerability finding is ever reported, and no evidence artifact is named by path the way the failover
      proof and drift evidence files are in the peer systems.'
  average: 8.0
  rationale: Container hardening where a fixed 30-rule denominator makes the 7-to-1 reduction attributable
  featured: true
- slug: multi-cloud-govramp-lab
  axis_scores:
    technical_depth: 8
    voice: 7
    validation: 7
  axis_reasoning:
    technical_depth: Four k3s clusters across AWS, Azure, GCP, and an on-prem hub with per-cloud OpenTofu
      modules, Argo CD App-of-Apps from the hub, a Velero cross-cluster restore, a 60-control GovRAMP
      crosswalk, and a Crossplane versus OpenTofu comparison; the system is the broadest in the lens,
      but the 19-edge diagram carries far less of it than the peers carry of theirs.
    voice: The README is specific about scope, controls, and evidence coming before workloads, but the
      source doc falls into a passive step-summary cadence (this step establishes, this confirms, this
      demonstrates) that reads as curriculum rather than build notes.
    validation: The ATO readiness phase is the strongest, with gaps routed to a remediation register and
      the system called partially rather than fully compliant, but the DR drill reports its RTO and RPO
      only as values well within thresholds, so the headline recovery evidence stays unquantified in prose.
  average: 7.33
  rationale: Four-cluster GovRAMP lab with a cross-cluster DR drill and a 60-control crosswalk
  featured: false
- slug: fedramp-landing-zone-azure
